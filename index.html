          <h1 class="text-3xl font-bold text-gray-900">Custom Keyboards</h1>
          <p class="mt-2 text-gray-600">
            Handcrafted mechanical keyboards for enthusiasts

        </div>
      </header>

      <!-- Filter/Search Bar -->
      <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6">
        <div
          class="bg-white rounded-lg shadow-sm p-4 flex flex-col sm:flex-row gap-4"
        >
          <input
            type="text"
            x-model="searchQuery"
            placeholder="Search keyboards..."
            class="flex-1 px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"
          />
          <select
            x-model="filterCategory"
            class="px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"
          >
            <option value="all">All Categories</option>
            <option value="60%">60%</option>
            <option value="75%">75%</option>
            <option value="TKL">TKL</option>
            <option value="Full Size">Full Size</option>
          </select>
        </div>
      </div>

    <script>
      function keyboardStore() {
        return {
          searchQuery: "",
          filterCategory: "all",
          selectedKeyboard: null,
          keyboards: [],
          async init() {
            const response = await fetch("keyboards.json");
            this.keyboards = await response.json();
          },
          get filteredKeyboards() {
            return this.keyboards.filter((kb) => {
              const matchesSearch =
                kb.name
                  .toLowerCase()
                  .includes(this.searchQuery.toLowerCase()) ||
                kb.description
                  .toLowerCase()
                  .includes(this.searchQuery.toLowerCase());
              const matchesCategory =
                this.filterCategory === "all" ||
                kb.category === this.filterCategory;
              return matchesSearch && matchesCategory;
            });
          },
        };
      }
